<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GCG Human vs AI</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/mobile/battle/battle.css" />
  </head>
  <body>
    <main class="battle-app">
      <header class="battle-topbar">
        <div>
          <p class="battle-eyebrow">GUNDAM CARD GAME</p>
          <h1>Human vs AI</h1>
        </div>
        <button class="battle-reset" id="resetBtn" type="button">再來一局</button>
      </header>

      <section class="battle-status" aria-live="polite">
        <strong id="statusTitle">準備開始</strong>
        <span id="statusMessage">點擊開始對戰。</span>
      </section>

      <section class="battle-start" id="startScreen">
        <button class="battle-primary" id="startBtn" type="button">開始對戰</button>
      </section>

      <section class="battle-board" id="battleBoard" hidden>
        <section class="battle-player battle-opponent">
          <div class="battle-player-meta">
            <strong>對手 P2</strong>
            <span id="p2Meta">-</span>
          </div>
          <div class="battle-zone-row">
            <div class="battle-base" id="p2Base"></div>
            <div class="battle-resources" id="p2Resources"></div>
            <div class="battle-counts" id="p2Counts"></div>
          </div>
          <div class="battle-slots" id="p2Slots"></div>
        </section>

        <section class="battle-center">
          <span id="phaseText">-</span>
          <small id="latestEvent">-</small>
        </section>

        <section class="battle-player battle-self">
          <div class="battle-slots" id="p1Slots"></div>
          <div class="battle-zone-row">
            <div class="battle-base" id="p1Base"></div>
            <div class="battle-resources" id="p1Resources"></div>
            <div class="battle-counts" id="p1Counts"></div>
          </div>
          <div class="battle-player-meta">
            <strong>我方 P1</strong>
            <span id="p1Meta">-</span>
          </div>
          <div class="battle-hand" id="p1Hand"></div>
        </section>
      </section>

      <section class="battle-error" id="errorBox" hidden></section>
      <section class="battle-actions" id="actionsPanel" hidden></section>
    </main>
    <script src="/mobile/battle/battle.js" type="module"></script>
  </body>
</html>
