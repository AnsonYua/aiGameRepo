    raw_effect: "【爆發】配置此卡牌。\n【配置時】將我方的1張護盾加入手牌。\n【啟動·主要】【每回合1次】②：若我方戰鬥區中不存在機體，則配置1張「高達」（〔WB隊〕・AP3・HP3）的機體替代卡；若只存在1張機體，則配置1張「鋼加農」（〔WB隊〕・AP2・HP2）的機體替代卡；若存在2張或更多機體，則配置1張「鋼坦克」（〔WB隊〕・AP1・HP1）的機體替代卡。"
    keywords: []
    effects:
