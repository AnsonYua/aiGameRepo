        timing: BURST
        optional: false
        cost: none
        resolution:
          type: simple
          actions:
            - action: deploy
              target: source
      - kind: triggered
        timing: ENTERS_PLAY
        optional: false
        cost: none
        resolution:
          type: simple
          actions:
            - action: add_shield_to_hand
      - kind: activated
        timing: MAIN
        frequency: once_per_turn
        cost:
          - type: pay_resource
            amount: 2
            allowed_resource_types: [basic, ex]
        resolution:
          type: conditional_chain
          exclusive: true
          branches:
            - condition:
                type: board_count
                controller: self
                card_type: unit
                zone: battle_area
                op: eq
                value: 0
              actions:
                - action: deploy_token
                  token:
                    card_id: T-001
                    name: 高達
                    card_type: unit
                    traits: [WB隊]
                    base_ap: 3
                    base_hp: 3
                    keywords: []
            - condition:
                type: board_count
                controller: self
                card_type: unit
                zone: battle_area
                op: eq
                value: 1
              actions:
                - action: deploy_token
                  token:
                    card_id: T-002
                    name: 鋼加農
                    card_type: unit
                    traits: [WB隊]
                    base_ap: 2
                    base_hp: 2
                    keywords: []
            - condition:
                type: board_count
                controller: self
                card_type: unit
                zone: battle_area
                op: gte
                value: 2
              actions:
                - action: deploy_token
