schema_version: "0.1-draft"
source_file: "../gcg_card_effects_by_package/st01_card_effects.json"
package:
  code: ST01
  name: "Heroic Beginnings [ST01]"
notes:
  - "本檔係按 CARD_EFFECT_STRUCTURE_DESIGN.md 人手轉寫的草案。"
  - "正常使用費用放在 play_cost；EffectClause.cost 只放啟動能力或額外費用。"
  - "未有卡面效果的卡，effects 使用空陣列。"
  - "【機師】指定先以 pilot_requirement 表示，之後可再納入正式 schema vocabulary。"

cards:
  - card_id: ST01-001
    name: 高達
    card_type: UNIT
    level: 4
    play_cost: 3
    color: Blue
    terrain: [宇宙, 地球]
    traits: [地球聯邦, WB隊]
    resonance: 阿姆羅・雷
    base_ap: 3
    base_hp: 4
    raw_effect: "《修復2》（當我方的回合結束時，此機體回復指定數值）\n【搭乘中】我方的回合中，我方所有機體的AP+1。"
    keywords:
      - keyword: REPAIR
        value: 2
    effects:
      - kind: continuous
        condition:
          all_of:
            - type: source_is_paired
            - type: turn_side_is
              side: self
        target:
          scope: self_all_unit
        modifiers:
          - stat: AP
            amount: 1
        duration: while_condition_true

