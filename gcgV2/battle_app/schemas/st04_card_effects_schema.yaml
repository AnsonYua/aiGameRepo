  - card_id: ST04-010
    name: 基拉・大和
    card_type: PILOT
    level: 4
    play_cost: 1
    color: White
    terrain: []
    traits: [地球聯合, 調整者]
    resonance: null
    base_ap: "+2"
    base_hp: "+1"
    raw_effect: "【爆發】此卡牌加入手牌。\n【攻擊時】選擇對方的1張機體。本次戰鬥中，使其AP-2。"
    keywords: []
