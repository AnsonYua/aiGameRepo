schema_version: "0.1-draft"
source_file: "../gcg_card_effects_by_package/st04_card_effects.json"
package:
  code: ST04
  name: "SEED Strike [ST04]"
notes:
  - "本檔係按 CARD_EFFECT_STRUCTURE_DESIGN.md 人手轉寫的草案。"
  - "正常使用費用放在 play_cost；EffectClause.cost 只放啟動能力或額外費用。"
  - "未有卡面效果的卡，effects 使用空陣列。"
  - "【機師】指定先以 pilot_requirement 表示，之後可再納入正式 schema vocabulary。"
  - "BLOCKER / BREACH 屬於 intrinsic keyword ability，只放 keywords，不重複展開成 effects。"
  - "卡牌文字中的「此機體」用 event_source_is.source: this_unit 或 action target: this_unit 表示。"

cards:
  - card_id: ST04-001
    name: 機動型突擊高達
    card_type: UNIT
    level: 5
    play_cost: 4
    color: White
    terrain: [宇宙, 地球]
    traits: [地球聯合]
    resonance: 基拉・大和
    base_ap: 4
    base_hp: 4
    raw_effect: "《阻擋者》（可轉換為休息狀態並將攻擊對象改為此機體）\n【搭乘時·等級為Lv.4或更高的機師】選擇對方1張HP不高於4的機體。將其放回到持有者的手牌中。"
    keywords:
      - keyword: BLOCKER
    effects:
      - kind: triggered
        timing: PAIRING_COMPLETE
        optional: false
        cost: none
        condition:
          type: pilot_level
          op: gte
          value: 4
        target:
          controller: opponent
          card_type: unit
          comparisons:
            - field: hp
              op: lte
              value: 4
          count: 1
        resolution:
          type: simple
          actions:
            - action: return_to_hand
              target: chosen

