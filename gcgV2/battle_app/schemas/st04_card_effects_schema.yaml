  - card_id: ST04-012
    name: 突擊背包
    card_type: COMMAND
    level: 4
    play_cost: 2
    color: White
    terrain: []
    traits: []
    resonance: null
    base_ap: null
    base_hp: null
    raw_effect: "【爆發】若我方戰鬥區中不存在〔地球聯合〕的機體替代卡，則配置1張「機動型突擊高達」（〔地球聯合〕・AP3・HP3・《阻擋者》）的機體替代卡。\n【主要】若我方戰鬥區中不存在〔地球聯合〕的機體替代卡，則配置1張「重劍型突擊高達」（〔地球聯合〕・AP4・HP2・《阻擋者》）或「砲戰型突擊高達」（〔地球聯合〕・AP2・HP4・《阻擋者》）的機體替代卡。"
    keywords: []
    effects:
      - kind: triggered
        timing: BURST
        optional: false
        cost: none
        condition:
          not:
            type: board_count
            controller: self
            card_type: unit
            zone: battle_area
            token: true
            extra_filters:
              trait_any: [地球聯合]
            op: gte
            value: 1
        resolution:
          type: simple
          actions:
            - action: deploy_token
              token:
                card_id: T-008
                name: 機動型突擊高達
                card_type: unit
                traits: [地球聯合]
                keywords:
                  - keyword: BLOCKER
                base_ap: 3
                base_hp: 3
      - kind: activated
        timing: MAIN
        cost: none
        condition:
          not:
            type: board_count
            controller: self
            card_type: unit
            zone: battle_area
            token: true
            extra_filters:
              trait_any: [地球聯合]
            op: gte
            value: 1
        resolution:
          type: simple
          actions:
            - action: deploy_token
              choose: 1
              choices:
                - card_id: T-010
                  name: 重劍型突擊高達
                  card_type: unit
                  traits: [地球聯合]
                  keywords:
                    - keyword: BLOCKER
                  base_ap: 4
                  base_hp: 2
                - card_id: T-009
                  name: 砲戰型突擊高達
                  card_type: unit
                  traits: [地球聯合]
                  keywords:
                    - keyword: BLOCKER
                  base_ap: 2
                  base_hp: 4

