      - kind: triggered
        timing: BURST
        optional: false
        cost: none
        resolution:
          type: simple
          actions:
            - action: add_to_hand
              target: source
              visibility:
                reveal_to: all_players
                reason: burst
      - kind: triggered
        timing: ON_ATTACK
        optional: false
        cost: none
        condition:
          type: event_source_is
          source: this_unit
        target:
          controller: opponent
          card_type: unit
          count: 1
        resolution:
          type: simple
          actions:
            - action: modify_ap
              target: chosen
              amount: -2
              duration: this_battle

  - card_id: ST04-011
