schema_version: "0.1-draft"
source_file: "../gcg_card_effects_by_package/st02_card_effects.json"
package:
  code: ST02
  name: "Wings of Advance [ST02]"
notes:
  - "本檔係按 CARD_EFFECT_STRUCTURE_DESIGN.md 人手轉寫的草案。"
  - "正常使用費用放在 play_cost；EffectClause.cost 只放啟動能力或額外費用。"
  - "未有卡面效果的卡，effects 使用空陣列。"
  - "【機師】指定先以 pilot_requirement 表示，之後可再納入正式 schema vocabulary。"
  - "牌庫頂操作、防止護盾傷害、戰鬥破壞後觸發屬於需 engine 後續實作的高階 primitive。"

cards:
  - card_id: ST02-001
    name: 飛翼高達
    card_type: UNIT
    level: 6
    play_cost: 4
    color: Green
    terrain: [宇宙, 地球]
    traits: [流星作戰]
    resonance: 希洛・唯
    base_ap: 4
    base_hp: 5
    raw_effect: "《突破5》（當透過攻擊破壞對方的機體時，給予該方護盾區最前方的1張卡牌指定數值的傷害）\n此機體可以選擇對方活躍狀態且等級不高於Lv.4的機體作為攻擊對象。"
    keywords:
      - keyword: BREACH
        value: 5
    effects:
      - kind: continuous
        condition: none
        target:
          scope: source
        modifiers:
          - allow_attack_active:
              attack_target_filter:
                controller: opponent
                card_type: unit
                status: active
                comparisons:
                  - field: level
                    op: lte
                    value: 4
        duration: while_source_in_play

  - card_id: ST02-002
    name: 飛翼高達（鳥型型態）
    card_type: UNIT
    level: 3
    play_cost: 3
    color: Green
    terrain: [宇宙, 地球]
    traits: [流星作戰]
    resonance: 希洛・唯
    base_ap: 2
    base_hp: 2
    raw_effect: "【配置時】我方放置1張EX能源。"
    keywords: []
    effects:
      - kind: triggered
        timing: ENTERS_PLAY
        optional: false
        cost: none
        resolution:
          type: simple
          actions:
            - action: add_extra_energy
              amount: 1

  - card_id: ST02-003
    name: 重砲手高達
    card_type: UNIT
    level: 5
    play_cost: 3
    color: Green
    terrain: [地球]
    traits: [流星作戰]
    resonance: 特洛瓦・巴頓
    base_ap: 3
    base_hp: 4
    raw_effect: "【搭乘中】我方的回合中，當此機體透過戰鬥傷害破壞對方的機體時，給予對方所有等級不高於Lv.3的機體1點傷害。"
    keywords: []
    effects:
      - kind: triggered
        timing: ON_BATTLE_DESTROY
        optional: false
        cost: none
        condition:
          all_of:
            - type: source_is_paired
            - type: turn_side_is
              side: self
            - type: destroyed_unit_controller_is
              controller: opponent
            - type: event_source_is
              source: this_unit
        target:
          name: enemy_low_level_units
          scope: opponent_all_unit
          comparisons:
            - field: level
              op: lte
              value: 3
        resolution:
          type: simple
          actions:
            - action: damage
              target: $enemy_low_level_units
              amount: 1

