schema_version: "0.1-draft"
source_file: "../gcg_card_effects_by_package/st03_card_effects.json"
package:
  code: ST03
  name: "Zeon's Rush [ST03]"
notes:
  - "本檔係按 CARD_EFFECT_STRUCTURE_DESIGN.md 人手轉寫的草案。"
  - "正常使用費用放在 play_cost；EffectClause.cost 只放啟動能力或額外費用。"
  - "未有卡面效果的卡，effects 使用空陣列。"
  - "【機師】指定先以 pilot_requirement 表示，之後可再納入正式 schema vocabulary。"
  - "《支援N》屬於 intrinsic keyword ability，只放 keywords，不重複展開成 effects。"
  - "卡牌文字中的「此機體」用 event_source_is.source: this_unit 表示。"

cards:
  - card_id: ST03-001
    name: 新安州
    card_type: UNIT
    level: 6
    play_cost: 5
    color: Red
    terrain: [宇宙, 地球]
    traits: [新吉翁]
    resonance: 弗爾・伏朗托
    base_ap: 5
    base_hp: 4
    raw_effect: "【搭乘中】此機體獲得《高機動》效果。\n（此機體不會被阻擋）\n我方的回合中，當此機體透過戰鬥傷害破壞對方護盾區中的卡牌時，選擇對方的1張機體。給予其2點傷害。"
    keywords: []
    effects:
      - kind: continuous
        condition:
          type: source_is_paired
        target:
          scope: source
        modifiers:
          - grant_keyword: HIGH_MOBILITY
        duration: while_condition_true
      - kind: triggered
        timing: ON_SHIELD_BREAK
        optional: false
        cost: none
        condition:
          all_of:
            - type: turn_side_is
              side: self
            - type: event_source_is
              source: this_unit
        target:
          controller: opponent
          card_type: unit
          count: 1
        resolution:
          type: simple
          actions:
            - action: damage
              target: chosen
              amount: 2

