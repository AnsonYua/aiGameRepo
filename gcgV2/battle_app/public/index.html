<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GCG 真人對電腦對戰 V3</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" type="image/avif" href="/assets/board-bg.avif" />
    <link rel="preload" as="image" type="image/webp" href="/assets/card-back-opponent.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/coin-p1-token.webp" />
    <link rel="preload" as="image" type="image/webp" href="/assets/coin-p2-token.webp" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/battleV3.css" />
  </head>
  <body class="mobile-board battle-v3 replay-ready">
    <main class="app">
      <section class="review-shell">
        <section class="board" aria-label="真人對電腦對戰版面">
          <section class="player-zone opponent" data-player="p2">
            <div class="hand-row panel red-panel">
              <h2>對手手牌</h2>
              <div class="b3-hand-badge">手牌數 <span id="p2HandCount">(0)</span></div>
              <div class="hand" id="p2Hand"></div>
              <span class="b3-thinking-label" id="opponentThinkingLabel" aria-live="polite" hidden>
                <span class="b3-thinking-text">對手思考中</span>
                <span class="b3-thinking-dots" aria-hidden="true"><span></span><span></span><span></span></span>
              </span>
            </div>
            <div class="side-stack">
              <div class="deck-box">
                <strong>棄牌</strong>
                <div class="trash" id="p2Trash">0</div>
              </div>
              <div class="deck-box">
                <strong>牌庫</strong>
                <div class="mini-deck red" id="p2EnergyDeck"></div>
              </div>
            </div>
            <div class="base-strip red-panel">
              <strong class="b3-panel-label">基地</strong>
              <button class="base-card battle-click-zone" id="p2Base" type="button"></button>
            </div>
            <div class="resource-line resource-panel">
              <div class="shield-line">
                <strong>護盾</strong>
                <span id="p2ShieldCount">(0)</span>
                <div class="shields" id="p2Shields"></div>
              </div>
              <div class="energy-line">
                <strong>能量</strong>
                <span id="p2ResourceText">0 / 10</span>
                <div class="resource-pips" id="p2Resources"></div>
              </div>
              <div class="ex-line">
                <strong>EX</strong>
                <span id="p2ExResourceText">0 可用</span>
              </div>
            </div>
            <div class="battlefield red-panel">
              <div class="slots" id="p2Slots"></div>
            </div>
          </section>

          <section class="combat-area">
            <small id="combatMessage">點擊開始對戰。</small>
          </section>

          <section class="player-zone self" data-player="p1">
            <div class="battlefield blue-panel">
              <div class="slots" id="p1Slots"></div>
            </div>
            <div class="side-stack lower">
              <div class="deck-box">
                <strong>棄牌</strong>
                <div class="trash" id="p1Trash">0</div>
              </div>
              <div class="deck-box">
                <strong>牌庫</strong>
                <div class="mini-deck blue" id="p1EnergyDeck"></div>
              </div>
            </div>
            <div class="base-strip blue-panel">
              <strong class="b3-panel-label">基地</strong>
              <button class="base-card battle-click-zone" id="p1Base" type="button"></button>
            </div>
            <div class="resource-line resource-panel">
              <div class="shield-line">
                <strong>護盾</strong>
                <span id="p1ShieldCount">(0)</span>
                <div class="shields" id="p1Shields"></div>
              </div>
              <div class="energy-line">
                <strong>能量</strong>
                <span id="p1ResourceText">0 / 10</span>
                <div class="resource-pips" id="p1Resources"></div>
              </div>
              <div class="ex-line">
                <strong>EX</strong>
                <span id="p1ExResourceText">0 可用</span>
              </div>
            </div>
            <div class="hand-row panel blue-panel">
              <h2>手牌 <span id="p1HandCount">(0)</span></h2>
              <div class="hand" id="p1Hand"></div>
            </div>
          </section>
        </section>
      </section>

      <footer class="controls b3-controls">
        <button id="menuBtn" type="button" aria-label="選單">選單</button>
        <button class="b3-actions-btn" id="actionsListBtn" type="button">
          <span class="b3-actions-label">可操作</span>
          <span class="b3-actions-count" id="actionsFooterCount">0</span>
        </button>
        <button class="mobile-main-action" id="endTurnBtn" type="button">結束回合<span>讓過</span></button>
        <button id="logBtn" type="button">對局紀錄</button>
      </footer>

      <div class="b3-status" id="statusMessage">準備開始</div>

      <section class="b3-start" id="startScreen">
        <div class="b3-start-card">
          <h1>對局開始</h1>
          <button class="b3-start-button" id="startBtn" type="button">開始</button>
        </div>
      </section>

      <section class="b3-coin-flip" id="coinFlipOverlay" aria-live="polite" hidden>
        <div class="b3-coin-stage" aria-hidden="true">
          <div class="b3-coin-token" id="coinFlipToken">
            <div class="b3-coin-face b3-coin-front">
              <img src="/assets/coin-p1-token.webp" alt="" />
            </div>
            <div class="b3-coin-face b3-coin-back">
              <img src="/assets/coin-p2-token.webp" alt="" />
            </div>
          </div>
        </div>
        <div class="b3-coin-copy">
          <strong id="coinFlipTitle">擲毫中</strong>
          <span id="coinFlipSub">決定開局選擇權</span>
        </div>
      </section>

      <div class="b3-sheet-backdrop" id="sheetBackdrop" hidden></div>
      <section class="b3-sheet" id="sheet" hidden></section>
      <section class="b3-error" id="errorBox" hidden></section>
    </main>
    <script src="/battleV3.js" type="module"></script>
  </body>
</html>
