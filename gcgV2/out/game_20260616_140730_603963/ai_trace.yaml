        rested unit、清場、非必要的部署、基地部署、或配對。這些動作雖然合法，但每浪費一個主要階段動作在非 lethal 活動上就多一個風險：對手可能抽到反制、burst
        效果可能逆轉。如果攻擊和 deploy 都合法，先完成所有攻擊破盾、確定對手死了，再回頭做部署——到了下回合多餘部署仍有機會。例外：如果對手有 active
