    - id: command-kill-finisher
      summary: 敵方有只剩 1 HP 的單位：強烈優先使用指令卡在它再次攻擊前尾刀。
      source: /Users/hello/Desktop/cardAI/gcgV2/knowledge/experience/command-kill-finisher.yaml
