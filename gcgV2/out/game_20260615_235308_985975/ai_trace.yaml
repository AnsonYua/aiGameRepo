        card 只能放到戰鬥區空插槽，指令格式為 `play_card <card_id> <slot>`（需插槽號碼）。若 legal_commands
        中沒有包含該 card_id 的 `play_card` 指令，代表該卡在當前遊戲狀態下無法合法使用（基地已存活無法再部署基地、費用不足、等級不足等），不要自行組合指令。
      source: /Users/hello/Desktop/cardAI/gcgV2/knowledge/experience/card-type-placement.yaml
    - id: temp-effect-value-check
      summary: '"本回合"臨時效果（包括 debuff AP-3、buff AP+1、小額傷害）必須在該回合內能影響實際攻防時才有戰術價值。使用前先確認：①本方有
        active 單位本回合還能攻擊嗎（基地 AP+1 只給這回合能攻擊的單位才有用）？②對手是否有 active 單位即將攻擊或阻擋？③小額傷害（1-2
        damage）能否擊殺或讓後續攻擊補刀？如果所有可受益的單位都已 rested 且本回合不會再戰鬥，則該效果等同白燒牌。不要把「本回合」buff 當成下回合投資——回合結束時效果消失。針對
        debuff（AP-3）：使用前必須先計算 debuff 後會改變什麼：①能讓原本會死的我方單位活下來嗎？（敵方 AP - 3 >= 我方 HP 則仍會死，debuff
        沒用）②能讓敵方攻擊降到 0 或無法擊破基地/盾牌嗎？③能阻止 lethal 嗎？如果 debuff 後敵方攻擊力仍然 >= 我方被攻擊單位的剩餘
        HP，該單位仍然會死——debuff 完全沒改變戰鬥結果。不要為了「有 debuff 卡就用」而浪費。debuff 目標選擇優先級從高到低：①本回合能攻擊玩家/盾牌的
