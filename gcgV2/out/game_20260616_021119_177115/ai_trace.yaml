      attack my_slot_0 opponent_slot_1:
        if_unblocked: 互相造成傷害：對手 1 號位 存活（剩 1 HP）；我方 0 號位 被擊破
      attack my_slot_0 opponent_slot_2:
        if_unblocked: 互相造成傷害：對手 2 號位 存活（剩 4 HP）；我方 0 號位 被擊破
      attack my_slot_1 opponent_base:
        if_unblocked: 破壞對手 1 張盾牌（剩 3 張）
      attack my_slot_1 opponent_slot_0:
        if_unblocked: 互相造成傷害：對手 0 號位 存活（剩 1 HP）；我方 1 號位 被擊破
      attack my_slot_1 opponent_slot_1:
        if_unblocked: 互相造成傷害：對手 1 號位 存活（剩 1 HP）；我方 1 號位 被擊破
      attack my_slot_1 opponent_slot_2:
        if_unblocked: 互相造成傷害：對手 2 號位 存活（剩 4 HP）；我方 1 號位 被擊破
    pair_annotations:
      pair st01/ST01-010 my_slot_0: 配對到 st01/ST01-008：非 Link 配對（該機體 Link 名單：無），AP+2/HP+1
      pair st01/ST01-010 my_slot_1: 配對到 st01/ST01-008：非 Link 配對（該機體 Link 名單：無），AP+2/HP+1
