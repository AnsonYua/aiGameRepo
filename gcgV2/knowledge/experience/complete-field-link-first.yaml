# 來源：game_20260616_133457_311473 Turn 8-10 review
# P2 T8 部署 ST01-007，Suletta pair 選項在 legal_commands。T10 場上仍有 ST01-007，
# pair st01/ST01-011 my_slot_0 合法可選，但 P2 選擇部署 ST01-001 再將 Suletta 錯配到 ST01-001。
# 結果兩個 Link Unit 都浪費：ST01-007 冇 pair，ST01-001 配錯 Pilot。
# 教訓：場上已有未配對 Link Unit + 對應 Pilot pair 指令合法 → 優先完成該 Link。
id: complete-field-link-first
priority: 10
description: '場上已有未配對的 Link Unit（可能是上回合部署的），且 legal_commands 中出現對應 Link Pilot 的 pair 指令時，優先完成該 Link，而不是先部署新 Unit。原因：①完成 Link 立即讓該單位本回合可攻擊（解除召喚失調）；②取得 AP/HP 加成提升生存力與攻擊力；③可能觸發 When Paired 效果（如 ST01-006 AP-3）。部署新 Unit 需要多一個回合才能攻擊（除非新 Unit 也能立刻完成 Link），在已有 active pair 選項時，完成場上既有威脅比部署新威脅節奏更快。部署新 Unit 只在以下情況優先：新 Unit 的 deploy effect 能立即改變戰局、能阻止對手 lethal、或場上 existing Link Unit 的對應 Pilot 不在手牌中。'
condition:
  has_unpaired_units: true
  has_pairable_in_hand: true
  turn_min: 4
