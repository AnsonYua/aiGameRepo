# 來源：多局 review：AI 有時部署 ST01-007 後沒有跟進 ST01-011，
# 或把 ST01-011 錯配到非 Link 目標，忽略 ST01-007 + Suletta 的攻擊節奏。
# 教訓：ST01-007 本身沒有額外文字效果；價值來自與 ST01-011 達成 Link，
# 以及 Suletta 的 [Attack] 重置資源後帶來的後續行動。
id: st01-007-suletta-link-attack
priority: 10
description: 'ST01-007 (Gundam Aerial) 本身沒有額外文字效果，核心價值是與 ST01-011 Suletta Mercury 達成 Link。若場上已有未配對 ST01-007，且 legal_commands 或 pair_annotations 顯示 `pair st01/ST01-011 my_slot_X` 指向該 slot 是 Link 配對，通常優先完成這個 pair，而不是先部署新 Unit 或把 Suletta 配到非 Link 目標。完成 Link 後 ST01-007 本回合可攻擊；攻擊時 ST01-011 的 [Attack][每回合1次] 可將 1 個我方 Resource 設為 active。攻擊後要重新檢查 legal_commands，評估能否利用重置資源做後續部署、配對、Command、基地效果或再攻擊。不要把 Suletta 的 [Attack] 價值套到本回合不能攻擊的非 Link 單位。'
condition:
  has_unpaired_units: true
  has_matching_pilot_in_hand: true
  has_pairable_in_hand: true
  turn_min: 3
