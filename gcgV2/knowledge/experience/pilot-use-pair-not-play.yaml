# 來源：game_20260616_100953_596549 Turn 5-8 review
# P2 知道 ST01-007 + ST01-011 (Suletta) 可以 Link，但執行時用了 play_card st01/ST01-011
# 而非 pair st01/ST01-011 my_slot_X。legal_commands 中有 pair 選項，但 AI 選錯指令格式。
# 教訓：Pilot 卡必須用 pair 指令，不可用 play_card。
id: pilot-use-pair-not-play
priority: 10
description: 'Pilot 卡（如 ST01-011 Suletta Mercury、ST01-010 Amuro Ray、ST01-012/ST01-013 Kai Shiden）在主要階段必須用 `pair <card_id> <slot>` 指令配對到場上機體，不可用 `play_card <card_id>`。play_card 只能用於 Unit、Base、Command 卡。如果你看到 legal_commands 中有 `pair ...` 選項，就代表那張 Pilot 可以用 pair 指令配對；不要自己改成 play_card。如果 legal_commands 沒有包含你想用的 `pair` 或 `play_card`，代表當前狀態下不能執行——選其他合法指令。'
condition:
  has_pilot_in_hand: true
  turn_min: 2
