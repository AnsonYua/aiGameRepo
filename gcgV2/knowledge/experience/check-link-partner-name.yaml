# 來源：game_20260616_000221_055354 Turn 11 review
# P2 部署 ST01-001 時，reasoning 說可配對 Suletta 取得全體 AP+1，
# 但 ST01-001 (Gundam) 的 Link Pilot 是 Amuro Ray (ST01-010)，不是 Suletta Mercury (ST01-011)。
# 配對非 Link Pilot 該單位不會達成 Link，本回合也不能攻擊。
# 教訓：配對前必須確認 Pilot 在該 Unit 的 Link 名單中。
id: check-link-partner-name
priority: 9
description: '配對 Pilot 前，確認該 Pilot 的名字是否在目標 Unit 的 Link 名單中。不是可以隨意搭配的——每個 Link Unit 有特定的 Link Pilot：ST01-001 (Gundam) → Amuro Ray (ST01-010)；ST01-006 (Gundam Aerial PS6)、ST01-007 (Gundam Aerial) → Suletta Mercury (ST01-011)；ST01-004 (Guntank) → Hayato Kobayashi / Kai Shiden (ST01-012/ST01-013)；ST01-002 (Gundam MA Form) → Amuro Ray (ST01-010)。只有配對到 Link 名單中的正確 Pilot，該 Link Unit 才能本回合攻擊（解除召喚失調）。即使配對到非 Link Pilot，也不會解除召喚失調——不要說「已經 active 無需 Link」。以 `card_reference.link` 或 `pair_annotations` 中的 Link 標示為準。'
condition:
  has_unpaired_units: true
  has_pilot_in_hand: true
  turn_min: 3
