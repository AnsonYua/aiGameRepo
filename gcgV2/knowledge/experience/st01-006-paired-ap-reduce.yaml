# 好案例：P1 Turn 11,13 配對 Suletta → 選 active 敵方高威脅機體 → AP-3 再攻擊
# 差案例：P2 Turn 10 已攻擊/rested 的 ST01-006 再配對 → AP-3 選 rested 敵機 → 效果本回合消失，零收益
# 教訓：[When Paired] AP-3 必須在該單位攻擊前配對，選本回合仍有威脅的 active 目標
id: st01-006-paired-ap-reduce
priority: 8
description: 'ST01-006 (Gundam Aerial PS6) 的 [When Paired] 效果：選擇對手 1 張 Lv.5 以下的機體，本回合 AP-3。⏱ 關鍵 timing：AP-3 只在「本回合」有效，不是下回合。正確用法：①如果本回合 ST01-006 要攻擊 → 先配對觸發 AP-3 降低目標的反傷（使其 AP→0 or 1），再攻擊。②如果本回合用其他效果 rest 對手 active 威脅 → 先配對觸發 AP-3 降低其數值再 rest，讓下回合威脅減半。❌ 錯誤用法：ST01-006 已經攻擊完、變成 rested，才配對觸發 AP-3——目標敵機在你的回合不會再攻擊，效果在對手回合開始時消失，完全零收益。ST01-006 是 Link Unit (link: Suletta Mercury)，配對 Suletta 達成 Link 本回合即可攻擊；配對其他 Pilot 也行，只要在它攻擊前完成配對。'
condition:
  turn_min: 3
