# 來源：game_20260616_133457_311473 Turn 10 review
# P2 將 Suletta (ST01-011) 配對到 ST01-001 (Gundam)，非 Link 配對。
# 理由說「Suletta 有 Attack 觸發效果能活化資源」，但 Suletta 的 [Attack] 只在該 Pilot
# 所在的 Unit 攻擊時觸發。非 Link 配對加上剛部署不能攻擊，[Attack] 效果不會觸發。
# 教訓：非 Link Pilot 的 [Attack]/[When Paired] 效果評估要準確。
id: non-link-pair-value-check
priority: 9
description: '非 Link Pilot 配對到非 Link 機體的價值需要準確評估。①非 Link Pilot 的 [When Paired] 效果仍會觸發（如 Amuro rest、ST01-006 AP-3），但必須有合法目標；②[Attack] 觸發效果（如 Suletta 資源活化）只在該機體攻擊時觸發——非 Link 機體剛部署不能攻擊，[Attack] 不會觸發；③永久 AP/HP 加成有長期價值但缺乏「本回合可攻擊」的即時收益。不要把不同 Pilot 的效果適性套到不對的機體上。評估時：Link Pilot → 優先配對到對應 Link Unit 達成本回合攻擊；非 Link Pilot with [When Paired] → 視有冇合法目標決定；非 Link Pilot with [Attack] trigger → 僅在該機體已 active 且本回合能攻擊時有價值。'
condition:
  has_unpaired_units: true
  has_pilot_in_hand: true
  turn_min: 3
