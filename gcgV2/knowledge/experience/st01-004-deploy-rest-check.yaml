description: 'ST01-004（Guntank）的核心價值在於其 [Deploy] 效果：選擇對手 1 張剩餘 HP≤2 的 active 機體，將其橫置。部署前先檢查：對手場上是否有 active 且 HP≤2 的機體？如果沒有，[Deploy] 效果會落空，部署 Guntank 只是放一個 2/3 白板。當 [Deploy] 有目標時，部署後應優先規劃：橫置 target 後能否繞過 Blocker 攻擊基地？能否擊殺剛被 rest 的低 HP 單位？如果本回合沒有其他好行動（無其他 deploy、無攻擊、需填場面），部署白板 Guntank 仍可接受；但有更好選擇（如留資源部署 Link Unit、或等對手 deploy 低 HP 單位後再下回合部署）時，優先保留。ST01-004 是 Link Unit（link: Hayato Kobayashi），配對 Hayato 可讓其本回合攻擊，但 [Deploy] 效果與 Pilot 無關——先確認橫置目標價值，再決定是否配對。'
